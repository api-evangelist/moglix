name: Moglix
description: 'Moglix is an Indian B2B commerce platform for industrial and MRO (maintenance,
  repair, and operations) procurement, founded in 2015 and headquartered in Noida, India,
  with a Singapore base. Through MoglixBusiness it supplies enterprises with industrial
  products — safety equipment, electricals, power tools, fasteners, packaging, and office
  supplies — alongside supply-chain, procurement-software, and financing services. A
  unicorn backed by Accel and other investors, Moglix operates across manufacturing
  supply chains in India and international markets. This profile was added to the API
  Evangelist network as a portfolio lead; enrichment probing found an internal API host
  (api.moglix.com) but no public developer portal, OpenAPI, or documented API surface.'
